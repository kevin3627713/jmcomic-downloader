name: release-ios

on:
  workflow_dispatch:
  push:
    # tags:
    #   - "v*"

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version number
        id: get_version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  build-ios:
    needs: get-version
    env:
      VERSION: ${{ needs.get-version.outputs.VERSION }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      # --- 1. 显式初始化 iOS 工程 ---
      - name: Initialize iOS project
        run: pnpm tauri ios init

      # --- 2. (重点) 动态修改 Info.plist 配置 ---
      # 因为你们没有 Mac，无法使用 Xcode，如果需要加权限、改配置，都在这里用脚本改
      - name: Patch Info.plist (Optional)
        run: |
          # 找到刚刚 init 出来的 Info.plist 文件
          PLIST_PATH=$(find src-tauri/gen/apple -name "Info.plist" | head -1)
          
          if [ -n "$PLIST_PATH" ]; then
            echo "Found Info.plist at: $PLIST_PATH"
            
            # 【举例】添加网络请求权限 (允许 HTTP)
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST_PATH" || true
            
            # 【举例】添加相册权限描述 (如果你的 App 需要保存图片)
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string '我们需要保存漫画到您的相册'" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string '我们需要访问相册以保存漫画'" "$PLIST_PATH" || true
            
            # 打印出来看看改成功没有
            cat "$PLIST_PATH"
          else
            echo "Warning: Info.plist not found!"
          fi

      # --- 3. 执行无签名构建 ---
      - name: Build iOS app without signing
        run: |
          pnpm tauri ios build || {
            echo "Tauri CLI exited. This is expected for unsigned builds during the export phase."
          }

      # --- 4. 兜底与强制无签编译 ---
      - name: Ensure app is built (Fallback to manual xcodebuild)
        run: |
          APP_PATH=$(find src-tauri/gen/apple -type d -name "*.app" | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "⚠️ App not found, triggering fallback unsigned build via xcodebuild..."
            
            WORKSPACE_FILE=$(find src-tauri/gen/apple -name "*.xcworkspace" | head -1)
            PROJECT_FILE=$(find src-tauri/gen/apple -name "*.xcodeproj" | head -1)
            
            if [ -z "$PROJECT_FILE" ]; then
              echo "❌ Error: Cannot find .xcodeproj inside src-tauri/gen/apple."
              exit 1
            fi
            
            PROJECT_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
            
            if [ -n "$WORKSPACE_FILE" ]; then
              XCODE_TARGET="-workspace $WORKSPACE_FILE"
            else
              XCODE_TARGET="-project $PROJECT_FILE"
            fi
            
            xcodebuild build \
              $XCODE_TARGET \
              -scheme "${PROJECT_NAME}_iOS" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath src-tauri/gen/apple/build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            echo "✅ App compiled successfully by Tauri CLI: $APP_PATH"
          fi

      # --- 5. 打包为无签名 IPA ---
      - name: Package IPA (unsigned)
        run: |
          APP_PATH=$(find src-tauri/gen/apple -type d -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: Cannot find compiled .app. Build failed."
            exit 1
          fi
          
          echo "Found .app at: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH")
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          if [ -d "Payload/$APP_NAME/Frameworks" ]; then
            find "Payload/$APP_NAME/Frameworks" -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; 2>/dev/null || true
          fi
          codesign --force --sign - "Payload/$APP_NAME" 2>/dev/null || true
          
          zip -q -r jmcomic-downloader_${{ env.VERSION }}_ios_no_sign.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-assets
          path: jmcomic-downloader_*_ios_no_sign.ipa